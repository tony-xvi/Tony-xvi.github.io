<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>打造你的理想型</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap');
    body { font-family: 'Noto Sans TC', system-ui, sans-serif; }

    .mobile-frame {
      max-width: 428px;
      margin: 0 auto;
      min-height: 100vh;
      background: #fff;
      box-shadow: 0 0 30px rgba(0,0,0,0.1);
      border-radius: 48px;
      overflow: hidden;
      position: relative;
    }

    @media (max-width: 380px) {
      .mobile-frame { border-radius: 32px; max-width: 100%; margin: 0; box-shadow: none; }
    }

    .tag-container { display: flex; flex-wrap: wrap; gap: 10px; padding: 8px 0; }
    .tag {
      transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 10px 18px;
      font-size: 15px;
      font-weight: 500;
      border-radius: 9999px;
      border: 2px solid #e5e7eb;
      background-color: #fff;
      color: #374151;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 100%;
    }
    .tag:hover { border-color: #fbb6d0; transform: translateY(-1px); box-shadow: 0 4px 12px rgba(249, 115, 173, 0.15); }
    .tag.selected {
      background: linear-gradient(90deg, #ff4d94, #c026d3);
      color: white;
      border-color: #ff4d94;
      box-shadow: 0 4px 15px rgba(249, 115, 173, 0.4);
      transform: scale(1.06);
    }
    .tag i { font-size: 13px; opacity: 0; transition: all 0.2s; }
    .tag.selected i { opacity: 1; }

    .bottom-nav {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      position: fixed;
      bottom: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 100%;
      max-width: 428px;
      background: white;
      border-top: 1px solid #e5e7eb;
      box-shadow: 0 -4px 20px rgba(0,0,0,0.08);
      padding: 14px 20px;
      z-index: 50;
    }

    .match-card {
      background: linear-gradient(135deg, #fffbeb 0%, #fdf4ff 100%);
      border-radius: 28px;
      padding: 28px 24px;
      box-shadow: 0 20px 40px -10px rgba(249, 115, 173, 0.25);
    }
    .avatar-img {
      width: 180px;
      height: 180px;
      object-fit: cover;
      border-radius: 24px;
      box-shadow: 0 10px 25px rgba(249, 115, 173, 0.4);
      transition: filter 0.4s ease;
      cursor: pointer;
    }

    .dual-range {
      position: relative;
      height: 44px;
    }
    .dual-range input[type="range"] {
      position: absolute;
      width: 100%;
      height: 44px;
      top: 0;
      left: 0;
      background: transparent;
      pointer-events: none;
      -webkit-appearance: none;
    }
    .dual-range input[type="range"]::-webkit-slider-thumb {
      pointer-events: auto;
      -webkit-appearance: none;
      width: 28px;
      height: 28px;
      background: #ff4d94;
      border-radius: 50%;
      box-shadow: 0 4px 12px rgba(255, 77, 148, 0.3);
      cursor: pointer;
      border: 3px solid white;
    }
    .dual-range .track-bg {
      position: absolute;
      top: 18px;
      left: 12px;
      right: 12px;
      height: 8px;
      background: #e5e7eb;
      border-radius: 9999px;
      overflow: hidden;
    }
    .dual-range .track-fill {
      position: absolute;
      top: 18px;
      left: 12px;
      height: 8px;
      background: linear-gradient(to right, #ff4d94, #a855f7);
      border-radius: 9999px;
    }
  </style>
</head>

      </button>
      <button onclick="nextStep()" id="nextBtn"
        class="next-btn bg-gradient-to-r from-pink-500 to-purple-600 text-white rounded-3xl font-semibold flex-1">
        下一步

      <button onclick="finish()" class="finish-btn flex items-center gap-1 text-pink-500 font-medium hover:text-pink-600">

      { id:5, photo:"5.jpg", age:24, height:180, job:"行銷專員", traits:["氣質型男","穿搭有型","成熟型","創業者","追求成長","溝通良好","一起旅行","寵女友","主管"] }
    ];

    function toggleGender(btn) {
      document.querySelectorAll('.gender-btn').forEach(b => b.classList.remove('border-pink-500', 'bg-pink-50'));
      btn.classList.add('border-pink-500', 'bg-pink-50');
      idealGender = btn.dataset.value;
      currentCategories = genderCategories[idealGender === '男生' ? 'male' : idealGender === '女生' ? 'female' : 'neutral'];
      if (currentStep >= 2) renderStep(currentStep);
    }

    function updateDualRange(id) {
      const minInput = document.getElementById(id + 'Min');
      const maxInput = document.getElementById(id + 'Max');
      const fill = document.getElementById(id + 'Fill');
      let minVal = parseInt(minInput.value);
      let maxVal = parseInt(maxInput.value);
      if (minVal > maxVal) minInput.value = maxVal;
      const valueEl = document.getElementById(id + 'Value');
      valueEl.textContent = `${minInput.value} - ${maxInput.value}`;
      const range = maxInput.max - maxInput.min;
      const left = ((minVal - maxInput.min) / range) * 100;
      const width = ((maxVal - minVal) / range) * 100;
      fill.style.left = `calc(12px + ${left}%)`;
      fill.style.width = `${width}%`;
    }

    function renderStep(step) {
      let html = '';
      if (step === 1) {
        html = `
          <div class="step">
            <div class="step-header flex justify-between items-center mb-8 pt-6">
              <span class="text-pink-500 font-bold text-xl">步驟 1 / 7</span>
            </div>
            <h2 class="text-2xl font-semibold mb-6">基本條件</h2>
            <div class="space-y-8">
              <div>
                <p class="text-sm text-gray-500 mb-2">想找的性別</p>
                <div class="flex gap-3">
                  <button onclick="toggleGender(this)" data-value="男生" class="gender-btn flex-1 py-4 rounded-2xl border-2 border-gray-200 text-center font-medium">男生</button>
                  <button onclick="toggleGender(this)" data-value="女生" class="gender-btn flex-1 py-4 rounded-2xl border-2 border-gray-200 text-center font-medium">女生</button>
                  <button onclick="toggleGender(this)" data-value="不限" class="gender-btn flex-1 py-4 rounded-2xl border-2 border-gray-200 text-center font-medium">不限</button>
                </div>
              </div>
              <div>
                <p class="text-sm text-gray-500 mb-2">年齡範圍 <span id="ageValue" class="font-semibold text-pink-500">24 - 32</span> 歲</p>
                <div class="dual-range">
                  <div class="track-bg"></div>
                  <div id="ageFill" class="track-fill"></div>
                  <input type="range" min="18" max="45" value="24" id="ageMin" oninput="updateDualRange('age')">
                  <input type="range" min="18" max="45" value="32" id="ageMax" oninput="updateDualRange('age')">
                </div>
              </div>
              <div>
                <p class="text-sm text-gray-500 mb-2">身高範圍 <span id="heightValue" class="font-semibold text-pink-500">165 - 185</span> cm</p>
                <div class="dual-range">
                  <div class="track-bg"></div>
                  <div id="heightFill" class="track-fill"></div>
                  <input type="range" min="150" max="200" value="165" id="heightMin" oninput="updateDualRange('height')">
                  <input type="range" min="150" max="200" value="185" id="heightMax" oninput="updateDualRange('height')">
                </div>
              </div>
            </div>
          </div>`;
      } else if (step >= 2 && step <= 7) {
        const cat = currentCategories[step];
        html = `
          <div class="step">
            <div class="step-header flex justify-between items-center mb-8 pt-6">
              <span class="text-pink-500 font-bold text-xl">步驟 ${step} / 7</span>
              <span class="text-pink-500 text-sm font-medium bg-pink-50 px-3 py-1 rounded-3xl">${selectedTags.size} 個已選</span>
            </div>
            <h2 class="text-2xl font-semibold mb-6">${cat.title}</h2>
            <div class="tag-container">
              ${cat.tags.map(tag => `
                <button onclick="toggleTag(this)" data-tag="${tag}" 
                  class="tag ${selectedTags.has(tag) ? 'selected' : ''}">
                  ${selectedTags.has(tag) ? '<i class="fa-solid fa-check"></i>' : ''}
                  ${tag}
                </button>
              `).join('')}
            </div>
          </div>`;
      }
      document.getElementById('mainContent').innerHTML = html;
      if (step === 1) {
        setTimeout(() => { updateDualRange('age'); updateDualRange('height'); }, 10);
      }
    }

    function toggleTag(btn) {
      const tag = btn.dataset.tag;
      if (selectedTags.has(tag)) selectedTags.delete(tag);
      else selectedTags.add(tag);
      renderStep(currentStep);
    }

    function nextStep() {
      if (currentStep < 7) {
        currentStep++;
        renderStep(currentStep);
      } else finish();
    }

    function prevStep() {
      if (currentStep > 1) {
        currentStep--;
        renderStep(currentStep);
      }
    }

    // 加強版配對邏輯（增加隨機性 + 更好符合標籤 + 更多職業匹配）
    function matchBestCandidate() {
      const userTags = Array.from(selectedTags);
      let scores = [];

      candidates.forEach(candidate => {
        let score = 5; // 基礎分數，讓隨機性更高
        userTags.forEach(tag => {
          if (candidate.traits.includes(tag)) {
            score += 4; // 標籤匹配加分
            if (tag.includes("醫師") || tag.includes("工程師") || tag.includes("主管") || tag.includes("創業者")) score += 10; // 職業標籤大幅加權
          }
        });
        if ((idealGender === '男生' && candidate.gender === 'male') ||
            (idealGender === '女生' && candidate.gender === 'female')) score += 6;
        scores.push({candidate, score});
      });

      // 加權隨機，讓五個人出現機會更均衡
      const total = scores.reduce((sum, item) => sum + Math.max(item.score, 1), 0);
      let rand = Math.random() * total;

      for (let item of scores) {
        rand -= Math.max(item.score, 1);
        if (rand <= 0) return item.candidate;
      }
      return scores[Math.floor(Math.random() * scores.length)].candidate; // 保底隨機
    }

      const ageMin = document.getElementById('ageMin') ? document.getElementById('ageMin').value : 24;

      const matched = matchBestCandidate();

      const summaryHTML = `
        <div class="text-center py-8">

            <p class="font-medium mb-3">你的條件</p>
            <p>性別：${idealGender}</p>
            <p>年齡：${ageMin}～${ageMax} 歲</p>

            <p class="font-medium mt-6 mb-3">已選標籤（${selectedTags.size} 個）</p>
            <div class="flex flex-wrap gap-2">
              ${Array.from(selectedTags).map(tag => `<span class="px-4 py-1 bg-pink-100 text-pink-600 text-sm rounded-3xl">${tag}</span>`).join('')}
            </div>
          </div>

          <div class="match-card">
            <div class="flex justify-center mb-6">
              <img src="${matched.photo}" class="avatar-img blur-xl" id="matchedPhoto" onclick="this.classList.remove('blur-xl')" alt="配對照片">
            </div>
            <p class="text-center text-pink-600 mb-6">${matched.age} 歲 • ${matched.height} cm • ${matched.job}</p>
            <p class="text-center text-gray-600 mb-8">配對分數最高的人！</p>
          </div>

          <button onclick="location.reload()" class="mt-8 w-full py-5 bg-gradient-to-r from-pink-500 to-purple-600 text-white rounded-3xl font-semibold text-xl">
            重新打造理想型
          </button>
        </div>`;

      document.getElementById('mainContent').innerHTML = summaryHTML;
    }

    window.onload = () => {
      currentCategories = genderCategories.neutral;
      renderStep(1);
    };
  </script>
</body>
</html>
